# v* 태그를 푸시하면 ClaudeMascot.exe 를 빌드해 GitHub 릴리즈로 올린다.
# 릴리즈 제목 = 태그 메시지 첫 줄, 본문 = 나머지. 태그는 마크다운 제목(#)이 지워지지 않게 이렇게 만든다:
#   git tag -a v1.2.0 --cleanup=verbatim -F notes.md
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # checkout 은 주석 태그를 가벼운 태그로 받아 메시지가 없다: 태그 객체를 다시 받는다
      - name: Fetch tag message
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME" > title.txt
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          test -s title.txt || echo "$GITHUB_REF_NAME" > title.txt
          # exe 가 자기 버전을 알아야 업데이트를 확인한다: build.bat 이 이 파일을 exe 안에 넣는다
          printf '%s' "$GITHUB_REF_NAME" > mascot/version.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        run: |
          pip install pyinstaller pystray pillow
          .\build.bat

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ClaudeMascot.exe --title "$(cat title.txt)" --notes-file notes.md
